apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s
  - ../../base

namePrefix: dev-

namespace: ejemplo-python

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: ejemplo-python
  - path: resource-limits.yaml
    target:
      kind: Deployment
      name: ejemplo-python

configMapGenerator:
  - name: ejemplo-python-env
    behavior: create
    literals:
      - ENVIRONMENT=dev
      - DEBUG=true
      - LOG_LEVEL=debug

generatorOptions:
  disableNameSuffixHash: true
